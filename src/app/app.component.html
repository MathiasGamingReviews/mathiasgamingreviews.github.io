<header class="site-header">
  <a class="brand" routerLink="/">
    <img [src]="siteLogo" alt="" width="56" height="56" />
    <span>{{ siteName }}</span>
  </a>
</header>

<nav class="menu-bar" aria-label="Main menu">
  <ul>
    <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a></li>
    <li><a routerLink="/news" routerLinkActive="active">News</a></li>
    <li><a routerLink="/reviews" routerLinkActive="active">Reviews</a></li>
    @if (editing) {
      <!-- Dev mode only (ng serve). -->
      <li><a class="edit-link" routerLink="/admin" routerLinkActive="active">✎ Edit</a></li>
    }
  </ul>
</nav>

<main class="page">
  <router-outlet />
</main>
